name: A股持仓跟踪 (北京时间 16:00)

# 触发: 每周一至周五 北京时间 16:00 (= UTC 08:00, 收盘后数据已落库)
# 也支持在 Actions 页面手动 Run workflow 测试
on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 持仓出场判定 + 推送微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python track_positions.py

      - name: 提交 results_live 回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_live/ || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: track $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
