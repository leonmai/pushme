name: A股盘中盯盘 (交易时段每半小时)

# 触发: 每周一至周五 交易时段 北京时间 每半小时 (= UTC 01:00-07:30, 每 30 分钟)
#  覆盖 9:30-11:30 上午段 与 13:00-15:00 下午段
# 也支持在 Actions 页面手动 Run workflow 测试
on:
  schedule:
    - cron: '*/30 1-7 * * 1-5'
  workflow_dispatch: {}

# 允许把 results_live/ 提交回仓库, 以持久化信号去重 state.json
permissions:
  contents: write

# 串行锁: 纯靠 GitHub 原生 cron 驱动; 此锁仅用于防止"手动 Run workflow"与定时运行重叠时同时 git push 冲突
concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    # 自链路: 一次点火跑完全天 9 档 (09:35~14:35), 最长约 5.5h, 留足余量
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 轻量校验: 确认 checkout 出来的代码含自链路修复串 (不阻断, 仅提示)
      # checkout 已拿到 main 最新提交的正确代码, 不再走 Contents API 刷新(避免 Actions 内嵌 python 偶发异常)
      - name: 校验本地代码含修复串
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import sys
          try:
              src = open('live_scout.py', encoding='utf-8').read()
              sv = open('screener_v2.py', encoding='utf-8').read()
              ok = ('iloc[max(0, i - 3):i].mean()' in src) and ('VOL_MULT = 2.0' in sv)
              print('FIX', 'VERIFIED' if ok else 'MISSING — 仍用 checkout 代码继续')
          except Exception as e:
              print('校验跳过(异常):', e)
          PYEOF

      - name: 安装依赖 (云端仅必需项, 装得快)
        run: pip install -r requirements.txt

      - name: 盘中扫描 + 推送微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 live_scout.py

      - name: 提交结果回仓库 (持久化信号去重 state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_live/ || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: scout $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
