name: A股盘中盯盘 (交易时段每半小时)

# 触发: 每周一至周五 交易时段 北京时间 每半小时 (= UTC 01:00-07:30, 每 30 分钟)
#  覆盖 9:30-11:30 上午段 与 13:00-15:00 下午段 (原 13:30 单次扫描会漏掉下午信号)
# 也支持在 Actions 页面手动 Run workflow 测试
on:
  schedule:
    - cron: '*/30 1-7 * * 1-5'
  workflow_dispatch: {}

# 允许把 results_live/ 提交回仓库, 以持久化信号去重 state.json
permissions:
  contents: write

# 串行锁: 外部定时器(cron-job.org)与 GitHub 原生定时可能重叠, 自动排队避免同时 git push 冲突
concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 用 GitHub API 拉取最新源码, 覆盖 git checkout 可能检出的滞后 blob
      # (GitHub 的 git 对象复制偶尔滞后, API 内容后端则是最新的, 这里双保险)
      - name: 用 GitHub API 刷新最新源码 (绕过 git 对象复制滞后)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          H = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'x'}
          for f in ['live_scout.py', 'screener_v2.py']:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{f}', headers=H)
              d = json.loads(urllib.request.urlopen(req, timeout=30).read())
              open(f, 'wb').write(base64.b64decode(d['content']))
          print('源码已通过 API 刷新为最新 (绕过 git 对象滞后)')
          PY

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 (云端仅必需项, 装得快)
        run: pip install -r requirements.txt

      - name: 盘中扫描 + 推送微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python live_scout.py

      - name: 提交结果回仓库 (持久化信号去重 state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_live/ || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: scout $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
